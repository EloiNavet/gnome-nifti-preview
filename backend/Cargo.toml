[package]
name = "gnome-nifti-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "Fast NIfTI-1/NIfTI-2 preview backend for the GNOME NIfTI Preview Sushi plugin"
authors = ["Eloi Navet"]
repository = "https://github.com/EloiNavet/gnome-nifti-preview"
publish = false

[lib]
name = "gnome_nifti_preview"
path = "src/lib.rs"

[[bin]]
name = "nifti-preview"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libdeflater = { version = "1.24", optional = true }
memmap2 = "0.9"
serde_json = "1"

[features]
default = ["libdeflate"]
# libdeflate (C, vendored) inflates whole gzip streams about 2x faster than zlib.
# Build with --no-default-features for a pure-Rust binary.
libdeflate = ["dep:libdeflater"]

[profile.release]
lto = true
codegen-units = 1
strip = true
# An arithmetic overflow becomes a panic, caught per request, instead of a
# silently wrong index.
overflow-checks = true
panic = "unwind"
